services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: seek_ticket
      POSTGRES_USER: seek_ticket
      POSTGRES_PASSWORD: seek_ticket
    volumes:
      - seek_ticket_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  seek_ticket_pg:
